<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#dce9df" />
    <meta name="description" content="原创 3D 三轨列车跑酷游戏" />
    <title>轨跃都市 · Railbound Rush</title>
  </head>
  <body>
    <main class="game-shell" aria-label="轨跃都市三轨跑酷游戏">
      <div id="scene" aria-label="3D 三轨跑酷画面"></div>
      <section class="hud" aria-live="polite" hidden>
        <div class="brand"><span>RAILBOUND</span><strong>轨跃都市</strong></div>
        <div class="stats">
          <div><span>距离</span><strong id="score">00000</strong></div>
          <div><span>金币</span><strong class="coin-text">● <b id="coins">0</b></strong></div>
          <div><span>速度</span><strong id="speed">1.0×</strong></div>
        </div>
        <button id="pauseButton" class="icon-button" aria-label="暂停游戏">Ⅱ</button>
      </section>

      <section id="startScreen" class="panel visible">
        <div class="logo-mark" aria-hidden="true"><i></i><i></i><i></i></div>
        <p class="eyebrow">THREE TRACKS · ONE WAY FORWARD</p>
        <h1>轨跃都市</h1>
        <p class="tagline">穿梭三轨，跃上列车，冲向更远的城市</p>
        <button id="enterButton" class="primary-button" type="button">进入游戏 <span>→</span></button>
        <div class="how-to-play">
          <div><kbd>←</kbd><kbd>→</kbd><span>切换轨道</span></div>
          <div><kbd>↑</kbd><span>跳跃 / 上车顶</span></div>
          <div><kbd>↓</kbd><span>滑过高栏</span></div>
        </div>
      </section>

      <section id="characterScreen" class="panel selection-screen" aria-hidden="true"></section>

      <section id="pauseScreen" class="panel compact">
        <p class="eyebrow">TAKE A BREATH</p><h2>已暂停</h2>
        <button id="resumeButton" class="primary-button">继续奔跑</button>
      </section>
      <section id="gameOverScreen" class="panel compact">
        <p class="eyebrow">RUN COMPLETE</p><h2>本次冲刺</h2>
        <div class="result-grid">
          <div><span>距离</span><strong id="finalScore">0</strong></div>
          <div><span>金币</span><strong id="finalCoins">0</strong></div>
          <div><span>最高</span><strong id="bestScore">0</strong></div>
        </div>
        <button id="restartButton" class="primary-button">再跑一次 <span>↻</span></button>
      </section>
      <aside id="characterPanel" class="character-panel" aria-labelledby="characterPanelTitle" aria-busy="true" hidden>
        <header class="character-panel-header">
          <p class="eyebrow">CHOOSE YOUR RUNNER</p>
          <h2 id="characterPanelTitle">选择你的跑者</h2>
        </header>
        <div class="runner-stage" role="group" aria-label="左右切换跑者">
          <button id="previousCharacter" class="runner-switch" type="button" aria-label="上一位跑者" aria-controls="runnerPreview characterName"><span aria-hidden="true">‹</span></button>
          <canvas id="runnerPreview" class="runner-preview" aria-label="当前跑者的三维预览" hidden></canvas>
          <button id="nextCharacter" class="runner-switch" type="button" aria-label="下一位跑者" aria-controls="runnerPreview characterName"><span aria-hidden="true">›</span></button>
        </div>
        <div class="runner-caption">
          <p id="characterName" class="character-name" aria-live="polite" aria-atomic="true">猫猫跑者</p>
          <p id="characterIndex" class="character-index">03 / 03</p>
        </div>
        <div id="characterPreview" class="character-preview" role="group" aria-label="角色预览视角">
          <span>预览视角</span>
          <button type="button" data-preview-angle="front" aria-pressed="true" aria-label="查看角色正面">前</button>
          <button type="button" data-preview-angle="back" aria-pressed="false" aria-label="查看角色背面">后</button>
        </div>
        <p id="characterStatus" class="character-status" role="status" aria-live="polite" aria-atomic="true">正在加载猫猫跑者…</p>
        <button id="retryCharacter" class="text-button" type="button" hidden>重新加载角色</button>
        <div id="selectionActions" class="selection-actions" hidden>
          <button id="startButton" class="primary-button" type="button">开始奔跑 <span>→</span></button>
          <button id="backButton" class="text-button" type="button">← 返回首页</button>
        </div>
      </aside>
      <section id="webglError" class="panel compact error-panel">
        <h2>无法启动 3D 画面</h2><p>请使用支持 WebGL 的现代浏览器并启用硬件加速。</p>
      </section>
      <div id="toast" class="toast" role="status"></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
